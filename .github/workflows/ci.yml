name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tekoadb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint || echo "no lint configurado"

      - name: Build
        run: npm run build || echo "no build necesario"
            
      # INYECTAMOS TU CONFIGURACIÓN USANDO 127.0.0.1 (PARA EL FIX DE ::1)
      - name: Ejecutar Tests con Cobertura 
        env:
          NODE_ENV: test
          PORT: 3002
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tekoadb_test
          FRONTEND_URL: http://localhost:3000
          SESSION_SECRET: test-session-secret
          JWT_SECRET: test-jwt-secret
          TEST_USER: test
          TEST_PASSWORD: 1234
        run: npm run test
            
      - name: Subir reporte a Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}